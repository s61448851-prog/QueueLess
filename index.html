const mark='<svg viewBox="0 0 36 36"><path fill="currentColor" stroke="none" d="M13 3h10v10h10v10H23v10H13V23H3V13h10z"/></svg>';
const icon=(p)=>'<svg viewBox="0 0 24 24">'+p+'</svg>';
const clock=icon('<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>'),bell=icon('<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20h4"/>');
const name='<b class="brand">'+mark+'QueueLess</b>';
const nav='<header><div class="wrap nav"><a href="/" aria-label="QueueLess home">'+name+'</a><div class="navlinks"><a href="/#how">How it works</a><a href="/#clinic">Clinic info</a></div><a class="staff" href="/login">Staff login ↗</a></div></header>';
const foot='<footer id="clinic"><div class="wrap"><strong>CityCare Clinic</strong> · Fictional clinic for demonstration<p>Contact point: reception desk. No real appointments are booked here.</p></div></footer>';
function home(step=0){const labels=['Waiting','Almost your turn','Called'];return '<div class="wrap"><div class="clinicbar"><span>✚ &nbsp; CityCare Clinic</span><span class="mode">Demo Mode</span></div><main class="hero"><div><div class="eyebrow"><i></i> PATIENT QUEUE SERVICES</div><h1>Skip the waiting.<br><em>Not your turn.</em></h1><p class="lead">Get a digital token, see your place in line, and arrive when your doctor is ready for you.</p><div class="actions"><a class="primary" href="/join">'+ticket+'Join Queue →</a><a class="secondary" href="/track">'+clock+'Track My Token</a></div><small>No patient account needed</small></div><section class="scene" aria-label="Interactive example token"><div class="scenehead"><span class="eyebrow">TOKEN PREVIEW</span><span>0'+(step+1)+' / 03</span></div><div class="slip"><div class="sliphead">'+name+'<span class="pill">'+labels[step]+'</span></div><div class="ticketmain"><div class="eyebrow">YOUR DIGITAL TOKEN</div><strong>A-014</strong><p>General Medicine · Room 1</p></div><div class="perforation"></div><div class="metrics"><div><small>Patients ahead</small><b>'+[4,2,0][step]+'</b></div><div><small>'+ (step===2?'Go to':'Estimated wait')+'</small><b>'+['~40 min','~20 min','Room 1'][step]+'</b></div></div></div><button data-cycle>Example token · '+(step===2?'Replay':'Next update')+' ↻</button></section></main><section id="how"><div class="eyebrow">PATIENT GUIDE</div><h2>How it works</h2><div class="steps">'+[[ticket,'Get your token','Choose your doctor and join the queue from your phone.'],[clock,'Follow your place','See who’s ahead and how long your wait might be.'],[bell,'Arrive for your turn','Check your tracker for the call to your doctor’s room.']].map(([ic,t,d],i)=>'<article><div class="row"><span class="ico">'+ic+'</span><span class="num">0'+(i+1)+'</span></div><h3>'+t+'</h3><p>'+d+'</p></article>').join('')+'</div></section></div>'}
function guide(path){const pages={'/join':['Join Queue','To join, you’ll need your name, a 10-digit mobile number, and your choice of doctor.','Token registration opens in Stage 2. No information is collected in this preview.'],'/track':['Track My Token','Keep your token number and the mobile number used at registration together.','Personal token lookup opens in Stage 3. Try the example token on the home page.'],'/login':['Staff login','This entrance is for CityCare receptionists and administrators.','Staff sign-in is unavailable in Stage 1. No staff records are accessible.']};const [title,desc,note]=pages[path]||['Page not found','This address doesn’t lead to a QueueLess page.','Return home to explore the patient guide.'];return '<main class="wrap detail"><div class="eyebrow">CITYCARE CLINIC / PATIENT SERVICES</div><h1>'+title+'</h1><p class="lead">'+desc+'</p><p>'+note+'</p><a class="primary" href="/">← Back to home</a></main>'}


const active=s=>['waiting','called','in_consultation'].includes(s);
function stats(q,id){const w=q.tokens.filter(t=>t.status==='waiting');const ahead=id?w.findIndex(t=>t.id===id):w.length;return {waiting:w.length,ahead:Math.max(0,ahead),position:ahead<0?null:ahead+1,minutes:Math.max(0,ahead)*q.avg}}
function blocked(q,hour,settings){if(settings.paused)return 'All clinic queues are paused.';if(q.status!=='Available')return 'This doctor is '+q.status.toLowerCase()+'.';if(hour<settings.open||hour>=settings.close)return 'Registration is outside clinic opening hours.';if(q.limit&&q.counter>=q.limit)return 'Today’s token limit has been reached.';return ''}

function validate(name,phone){return !name.trim()||name.trim().length>80?'Enter a name between 1 and 80 characters.':!/^[6-9]\d{9}$/.test(phone)?'Enter a 10-digit Indian mobile number starting with 6–9.':''}

function seed(day){let ix=0;return {day,settings:{open:0,close:24,paused:false},doctors:[['A','Dr. Asha Menon','General Medicine','1',10,'Available',['completed','called','waiting','waiting']],['B','Dr. Rohan Iyer','Pediatrics','2',15,'Available',['completed','waiting','waiting']],['C','Dr. Meera Nair','Orthopedics','3',12,'Paused',['skipped','waiting']]].map(([letter,name,dept,room,avg,status,states])=>({letter,name,dept,room,avg,status,counter:states.length,limit:null,tokens:states.map((status,i)=>({id:'sample-'+day+'-'+letter+i,name:'Sample patient '+(++ix),phone:'000000000'+ix,code:letter+'-'+String(i+1).padStart(3,'0'),status,created:new Date().toISOString()}))}))}}

const prefix='queueless.demo.v2.';
const dayNow=(date=new Date())=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Kolkata'}).format(date);
const hourNow=()=>Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
function read(day=dayNow()){const v=localStorage.getItem(prefix+day);if(v)return JSON.parse(v);const db=seed(day);const first=localStorage.getItem(prefix+'sample-day');if((first&&first!==day)||(!first&&day!==dayNow()))for(const q of db.doctors){q.tokens=[];q.counter=0}return db}
function reason(q,s){return blocked(q,hourNow(),s)}
let channel;try{channel=new BroadcastChannel(prefix)}catch{}
function lock(fn){if(navigator.locks)return navigator.locks.request(prefix,fn);return new Promise((ok,no)=>{const r=indexedDB.open(prefix,1);r.onupgradeneeded=()=>r.result.createObjectStore('serial');r.onerror=()=>no(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('serial','readwrite');let result,err;tx.objectStore('serial').get('guard').onsuccess=()=>{try{result=fn()}catch(e){err=e;tx.abort()}};tx.oncomplete=()=>{db.close();ok(result)};tx.onabort=()=>{db.close();no(err||tx.error)}}})}
function join(name,phone,letter){return lock(()=>{const error=validate(name,phone);if(error)return {error};const db=read(),q=db.doctors.find(d=>d.letter===letter);if(!q)return {error:'Choose your doctor.'};const existing=q.tokens.find(t=>active(t.status)&&t.phone===phone);if(existing)return {duplicate:existing.id,day:db.day};const why=reason(q,db.settings);if(why)return {error:why};const id=crypto.randomUUID(),code=letter+'-'+String(++q.counter).padStart(3,'0');q.tokens.push({id,code,name:name.trim(),phone,status:'waiting',created:new Date().toISOString()});if(!localStorage.getItem(prefix+'sample-day'))localStorage.setItem(prefix+'sample-day',db.day);localStorage.setItem(prefix+db.day,JSON.stringify(db));channel?.postMessage(db.day);return {id,day:db.day}})}
function subscribe(fn){const storage=e=>{if(!e.key||e.key.startsWith(prefix))fn()};window.addEventListener('storage',storage);channel?.addEventListener('message',fn);return ()=>{window.removeEventListener('storage',storage);channel?.removeEventListener('message',fn)}}
function reset(){return lock(()=>{for(const k of Object.keys(localStorage))if(k.startsWith(prefix))localStorage.removeItem(k);channel?.postMessage('reset')})}


function lookup(code,phone,day=dayNow()){
  const normalized=code.trim().toUpperCase();
  if(!/^[A-Z]-\d{3,}$/.test(normalized))return {error:'Enter the token number on your slip, such as A-005.'};
  if(!/^[6-9]\d{9}$/.test(phone.trim()))return {error:'Enter the 10-digit mobile number used at registration.'};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||day>dayNow())return {error:'Select the date on your token slip.'};
  const q=read(day).doctors.find(q=>q.letter===normalized[0]);
  const t=q?.tokens.find(t=>t.code===normalized&&t.phone===phone.trim());
  return t?{day,id:t.id}:{error:'No matching token in this browser. Check the number, phone and visit date.'};
}
function cancel(day,id){return lock(()=>{
  const db=read(day),q=db.doctors.find(q=>q.tokens.some(t=>t.id===id)),t=q?.tokens.find(t=>t.id===id);
  if(!t)return {error:'This token is no longer available.'};
  if(!['waiting','called'].includes(t.status))return {error:'This token can no longer be cancelled.'};
  t.status='cancelled';t.updated_at=new Date().toISOString();
  (db.activity_log??=[]).push({action:'cancel',actor:'Patient',token_id:id,at:t.updated_at});
  localStorage.setItem(prefix+day,JSON.stringify(db));channel?.postMessage(day);return {ok:true};
})}

const escTxt=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={waiting:'Waiting',called:'Called',in_consultation:'In consultation',completed:'Completed',skipped:'Skipped',no_show:'No-show',cancelled:'Cancelled'};
function trackModel(db,id){
  const q=db?.doctors.find(d=>d.tokens.some(t=>t.id===id)),t=q?.tokens.find(t=>t.id===id);
  if(!t)return null;
  const s=stats(q,id),waiting=t.status==='waiting',paused=db.settings.paused||q.status!=='Available';
  const alert=t.status==='called'?'It’s your turn, please go to Room '+q.room+'.':waiting&&paused?'The queue is paused. Keep this tracker open for updates.':waiting&&s.ahead<=2?'Almost your turn, please reach the hospital.':({cancelled:'Your token is cancelled. You no longer hold a place in this queue.',completed:'Your visit is complete.',skipped:'Your turn was skipped. Contact reception for help.',no_show:'Your token was marked as a no-show. Contact reception for help.',in_consultation:'Your consultation is in progress.'}[t.status]||'Your place is saved. We’ll update this page as the queue moves.');
  return {t,q,s,alert,paused,waiting,serving:q.tokens.find(x=>['called','in_consultation'].includes(x.status))?.code||'No active token'};
}
function tracker(root,path,to){
  const href=p=>'#'+p;
  if(path==='/track'){
    root.innerHTML='<main class="wrap intake receipt"><div class="eyebrow">CITYCARE CLINIC / PATIENT SERVICES</div><h1>Track my token</h1><p class="lead">Find your place using the details from registration.</p><form novalidate><label>Token number<input name="code" placeholder="A-005" autocapitalize="characters" maxlength="12" required></label><label>Registered mobile number<input name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" required></label><label>Visit date (India time)<input type="date" name="day" required></label><p role="status"></p><button class="primary">Find my token →</button></form><p><small>Demo Mode · Use the same browser you used to join.</small></p></main>';
    const f=root.querySelector('form');f.elements.day.value=f.elements.day.max=dayNow();
    f.onsubmit=e=>{e.preventDefault();try{const r=lookup(f.elements.code.value,f.elements.phone.value,f.elements.day.value);if(r.id)to('/live/'+r.day+'/'+r.id);else f.querySelector('[role=status]').textContent=r.error}catch{f.querySelector('[role=status]').textContent='Browser storage is unavailable. Allow storage and try again.'}};return ()=>{};
  }
  const [,kind,day,id]=path.split('/');let alive=true,busy=false,previous='';
  root.innerHTML='<main class="wrap intake receipt"><div class="eyebrow">CITYCARE CLINIC / DEMO MODE</div><h1>'+ (kind==='live'?'Live token tracker':'Your digital token')+'</h1><div data-summary aria-live="polite"></div><div class="slipactions"></div><p role="status"></p><small>Demo links work only in this browser. No SMS is sent.</small><dialog><form method="dialog"><h2>Cancel this token?</h2><p>You’ll lose your place in the queue. To join again, you’ll need a new token.</p><div class="slipactions"><button class="secondary" value="keep" autofocus>Keep my token</button><button class="danger" value="cancel">Yes, cancel token</button></div></form></dialog></main>';
  const summary=root.querySelector('[data-summary]'),actions=root.querySelector('.slipactions'),dialog=root.querySelector('dialog'),msg=root.querySelector('[role=status]');
  function display(){let m;try{m=/^\d{4}-\d{2}-\d{2}$/.test(day)&&trackModel(read(day),id)}catch{}
    if(!m){summary.textContent='Token unavailable. Open the link in the browser where you joined, or check the token details.';actions.innerHTML='<a class="secondary" href="'+href('/track')+'">Find my token</a>';previous='';return}
    const {q,t,s,waiting,paused,serving,alert}=m,link='/live/'+day+'/'+encodeURIComponent(id),url=new URL(href(link),location.href).href,state=JSON.stringify([q.name,q.room,q.dept,t.code,t.status,s.position,s.minutes,paused,serving]);
    if(state===previous)return;previous=state;
    const note=waiting?'Your token is '+t.code+'. '+s.ahead+' patient'+(s.ahead===1?'':'s')+' ahead.':t.code+' · '+labels[t.status];
    const wait=waiting&&!paused?'~'+s.minutes+' min':'—';
    summary.innerHTML='<div class="receiptcard"><span class="pill st-'+escTxt(t.status)+'">'+escTxt(labels[t.status]||t.status)+'</span><div class="serial">'+escTxt(t.code)+'</div><b>'+escTxt(q.name)+'</b><p>'+escTxt(q.dept)+' · Room '+escTxt(q.room)+' · '+escTxt(day)+'</p><p class="turnalert '+(t.status==='called'?'called':'')+'">'+escTxt(alert)+'</p><div class="slipmetrics"><span>Position<strong>'+(waiting?s.position:'—')+'</strong></span><span>Now serving<strong>'+escTxt(serving)+'</strong></span><span>Estimated wait<strong>'+wait+'</strong></span></div><p>'+escTxt(note)+'</p><small>This is only an estimate and may change.</small></div><p><small>Last updated: '+escTxt(new Date().toLocaleTimeString())+' · Synced in this browser</small></p>';
    actions.innerHTML=(kind==='live'?'':'<a class="primary" href="'+href(link)+'">Track Live →</a>')+'<button class="secondary" data-copy>Copy token link</button><a class="secondary" target="_blank" rel="noopener noreferrer" href="https://wa.me/91'+encodeURIComponent(t.phone)+'?text='+encodeURIComponent(note+' Estimated wait: '+wait+'. CityCare Clinic demo; link works only in the original browser: '+url)+'">Share on WhatsApp ↗</a><button class="secondary" data-print>Print / Save PDF</button>'+(kind==='live'&&['called','waiting'].includes(t.status)?'<button class="danger" data-cancel>Cancel token</button>':'');
    actions.querySelector('[data-print]').onclick=()=>window.print();actions.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(url);msg.textContent='Token link copied.'}catch{msg.textContent='Copy this link: '+url}};
    const c=actions.querySelector('[data-cancel]');if(c)c.onclick=()=>{if(!busy){dialog.returnValue='keep';dialog.showModal()}};
  }
  dialog.onclose=async()=>{if(!alive||busy||dialog.returnValue!=='cancel')return;busy=true;try{const r=await cancel(day,id);if(alive){display();msg.textContent=r.error||'Token cancelled.'}}catch{if(alive)msg.textContent='Unable to save the cancellation. Please try again.'}finally{busy=false}};
  display();const unsub=subscribe(display);window.addEventListener('focus',display);
  return ()=>{alive=false;unsub();window.removeEventListener('focus',display)};
}

const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function patient(root,path,to){let dispose=()=>{},disposed=false;
const full=p=>location.href.split('#')[0]+'#'+p;
const inner=p=>'#'+p;
const msg=t=>{const el=root.querySelector('[role=status]');if(el)el.textContent=t};
function mount(){if(path==='/join'){root.innerHTML='<main class="wrap intake"><div class="eyebrow">CITYCARE CLINIC &nbsp;/&nbsp; PATIENT SERVICES</div><h1>Join the queue</h1><p class="lead">Choose a doctor to get your digital token.</p><div class="intakegrid"><form novalidate><h2>Patient details</h2><label>Your name<input name="patient" maxlength="80" required autocomplete="name"></label><label>Mobile number<input name="mobile" type="tel" maxlength="10" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit Indian number" required></label><label>Doctor<select name="doctor" required></select></label><div class="qinfo"></div><p role="status" aria-live="polite"></p><button class="primary" type="submit">Get my token →</button></form><aside><span class="mode">Demo Mode</span><h3>Before you join</h3><p>Use fictional details. This demo stores them in this browser. Tokens are shared between tabs here, never across devices.</p><p>Position counts only patients waiting ahead of you. This is only an estimate and may change.</p><small>Sample data is fictional. Demo registration is open 24 hours, India time.</small><button class="reset" type="button">Reset demo data</button></aside></div></main>';
const form=root.querySelector('form'),select=form.elements.doctor,btn=form.querySelector('[type=submit]');let busy=false;
function update(){const db=read(),old=select.value;select.innerHTML='<option value="">Select a doctor</option>'+db.doctors.map(q=>{const st=stats(q),why=reason(q,db.settings);return '<option value="'+q.letter+'" '+(why?'disabled':'')+'>'+safe(q.name+' · '+q.dept+' · '+q.status+' · '+st.waiting+' waiting · ~'+st.minutes+' min')+'</option>'}).join('');select.value=old;const q=db.doctors.find(d=>d.letter===select.value),why=q?reason(q,db.settings):'';root.querySelector('.qinfo').textContent=q?(why||q.dept+' · Room '+q.room+' · '+stats(q).waiting+' waiting · ~'+stats(q).minutes+' min'):(db.doctors.some(d=>!reason(d,db.settings))?'Only available doctors can be selected.':reason(db.doctors[0],db.settings));btn.disabled=busy||!!why}
select.onchange=update;form.oninput=()=>msg('');update();dispose=subscribe(update);
form.onsubmit=async e=>{e.preventDefault();if(busy)return;const name=form.elements.patient.value.trim(),phone=form.elements.mobile.value.trim(),letter=select.value;const issue=validate(name,phone)||(!letter?'Select an available doctor.':'');if(issue){msg(issue);(!name||name.length>80?form.elements.patient:!/^([6-9]\d{9})$/.test(phone)?form.elements.mobile:select).focus();return}busy=true;btn.disabled=true;try{const res=await join(name,phone,letter);if(disposed)return;if(res.error)msg(res.error);else if(res.duplicate){msg('You already have an active token for this doctor. ');const a=document.createElement('a');a.textContent='Open existing token';a.href=inner('/token/'+res.day+'/'+res.duplicate);root.querySelector('[role=status]').append(a)}else to('/token/'+res.day+'/'+res.id)}catch{msg('Your token couldn’t be saved. Allow local browser storage and try again.')}finally{busy=false;if(!disposed)update()}};
root.querySelector('.reset').onclick=async()=>{if(confirm('Remove all tokens created in this demo browser and restore the fictional sample queues?')){try{await reset();form.reset();update();msg('Demo queues restored.')}catch{msg('Unable to reset storage in this browser.')}}};
}else{dispose=tracker(root,path,to)}}
try{mount()}catch{root.innerHTML='<main class="wrap intake"><h1>Browser storage unavailable</h1><p>Allow local storage or use a fresh browser profile to try demo registration.</p></main>'}return ()=>{disposed=true;dispose()}}



let step=0,cleanup=()=>{};
function render(){cleanup();cleanup=()=>{};const [path,anchor]=location.hash.slice(1).split('#');const page=path||'/';const isPatient=page==='/join'||page==='/track'||/^\/(token|live)\//.test(page);const root=document.getElementById('root');root.innerHTML=nav+(isPatient?'<div id="patient"></div>':page==='/'?home(step):guide(page))+foot;root.querySelectorAll('a').forEach(a=>a.setAttribute('href','#'+a.getAttribute('href')));if(isPatient)cleanup=patient(root.querySelector('#patient'),page,p=>location.hash=p);if(anchor)document.getElementById(anchor)?.scrollIntoView();else window.scrollTo(0,0)}
addEventListener('hashchange',render);document.addEventListener('click',e=>{if(e.target.closest('[data-cycle]')){step=(step+1)%3;render();document.querySelector('[data-cycle]').focus({preventScroll:true})}});render();
</script></html>
